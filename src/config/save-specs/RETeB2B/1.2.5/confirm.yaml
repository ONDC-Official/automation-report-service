# `order_id` is read by commonChecks.compareOrderIdContinuity from on_confirm, cancel,
# on_cancel, update and on_update. The rest is read by the on_confirm echo checks in
# orderFormationChecks: the settlement terms and seller tax identity the seller must not
# change after the buyer has committed, the quote price that must not drift, the payment
# status that must not revert from PAID, and the timestamp + ttl bounding how long the
# seller had to answer.
#
# `updated_at` is here for orderFormationChecks.validateUpdatedAtAdvances: a seller may
# re-stamp the order but never backwards, so on_confirm's updated_at must be strictly later
# than the value the buyer committed here.
#
# Still NO `created_at`: unlike updated_at it is deliberately NOT compared across
# confirm -> on_confirm, because every reference flow legitimately re-stamps it
# (COD ...595Z at confirm vs ...612Z at on_confirm; measured deltas 15-74 ms across the
# nine flows). An equality rule there would false-fail all nine. on_confirm validates its
# own created_at against its own context instead.
#
# `items`, `payments` and `settlement_details` come back as a BARE OBJECT when the match
# has exactly one element (src/utils/extract.ts:16) — consumers normalize via `normalizeSaved`.
save-data:
  order_id: "$.message.order.id"
  provider: "$.message.order.provider"
  items: "$.message.order.items[*]"
  payments: "$.message.order.payments[*]"
  timestamp: "$.context.timestamp"
  ttl: "$.context.ttl"
  updated_at: "$.message.order.updated_at"
  quote_price: "$.message.order.quote.price.value"
  bpp_terms: "$.message.order.tags[?(@.code == 'bpp_terms')]"
  settlement_details: "$.message.order.payments[*]['@ondc/org/settlement_details'][*]"
  billing: "$.message.order.billing"
